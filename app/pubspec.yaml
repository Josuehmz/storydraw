name: storydraw
description: "StoryDraw: del dibujo de un niño a un cuento ilustrado."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  perfect_freehand: ^2.5.2+1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/marca/logo.png

# Ícono de Android: `dart run flutter_launcher_icons` regenera los mipmap-* desde la marca.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/marca/icono.png
  adaptive_icon_background: "#FAF7EE"
  adaptive_icon_foreground: assets/marca/icono-frente.png
  min_sdk_android: 26
