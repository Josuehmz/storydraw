name: storydraw
description: "StoryDraw: del dibujo de un niño a un cuento ilustrado y narrado."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  perfect_freehand: ^2.5.2+1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
